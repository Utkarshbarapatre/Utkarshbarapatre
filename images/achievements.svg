<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.25" opacity="0.05"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="150" fill="#030812"/>
  <rect width="800" height="150" fill="url(#grid)"/>

  <!-- ACHIEVEMENT 1: TCS HackQuest -->
  <rect x="22" y="18" width="370" height="114" fill="#030812"/>
  <rect x="20" y="16" width="370" height="114" fill="#030c1a" stroke="#ffd700" stroke-opacity="0.3" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="16" width="370" height="4" fill="#ffd700" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Achievement unlocked tag -->
  <rect x="30" y="28" width="130" height="16" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="95" y="40" font-family="'Courier New',Courier,monospace" font-size="8" fill="#ffd700" text-anchor="middle" letter-spacing="1">ACHIEVEMENT UNLOCKED</text>

  <!-- Icon -->
  <circle cx="55" cy="90" r="28" fill="#ffd700" fill-opacity="0.06"/>
  <circle cx="55" cy="90" r="22" fill="#ffd700" fill-opacity="0.04" stroke="#ffd700" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 3">
    <animateTransform attributeName="transform" type="rotate" from="0 55 90" to="360 55 90" dur="20s" repeatCount="indefinite"/>
  </circle>
  <text x="55" y="100" font-size="24" text-anchor="middle">🏆</text>

  <text x="90" y="67" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#ffd700">TCS HackQuest</text>
  <text x="90" y="86" font-family="'Courier New',Courier,monospace" font-size="10.5" fill="#aaa">Top 100 National Finalist</text>
  <rect x="90" y="95" width="85" height="18" fill="#ffd700" fill-opacity="0.1" stroke="#ffd700" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="132" y="108" font-family="'Courier New',Courier,monospace" font-size="8" fill="#ffd700" text-anchor="middle" letter-spacing="1">CYBERSECURITY</text>
  <text x="186" y="108" font-family="'Courier New',Courier,monospace" font-size="8" fill="#555">· INDIA</text>

  <!-- Glow pulse -->
  <ellipse cx="205" cy="130" rx="50" ry="3" fill="#ffd700" opacity="0.08">
    <animate attributeName="opacity" values="0.08;0.3;0.08" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="50;70;50" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ACHIEVEMENT 2: NTAI Best Paper -->
  <rect x="412" y="18" width="370" height="114" fill="#030812"/>
  <rect x="410" y="16" width="370" height="114" fill="#030c1a" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="410" y="16" width="370" height="4" fill="#00f0ff" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <rect x="420" y="28" width="130" height="16" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="485" y="40" font-family="'Courier New',Courier,monospace" font-size="8" fill="#00f0ff" text-anchor="middle" letter-spacing="1">ACHIEVEMENT UNLOCKED</text>

  <circle cx="445" cy="90" r="28" fill="#00f0ff" fill-opacity="0.05"/>
  <circle cx="445" cy="90" r="22" fill="#00f0ff" fill-opacity="0.03" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 3">
    <animateTransform attributeName="transform" type="rotate" from="360 445 90" to="0 445 90" dur="18s" repeatCount="indefinite"/>
  </circle>
  <text x="445" y="100" font-size="24" text-anchor="middle">📄</text>

  <text x="480" y="67" font-family="'Courier New',Courier,monospace" font-size="15" font-weight="700" fill="#00f0ff">Best Paper Award</text>
  <text x="480" y="86" font-family="'Courier New',Courier,monospace" font-size="10.5" fill="#aaa">NTAI Conference 2025</text>
  <rect x="480" y="95" width="115" height="18" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="0.8"/>
  <text x="537" y="108" font-family="'Courier New',Courier,monospace" font-size="8" fill="#00f0ff" text-anchor="middle" letter-spacing="1">RESEARCH &amp; INNOVATION</text>

  <ellipse cx="595" cy="130" rx="50" ry="3" fill="#00f0ff" opacity="0.07">
    <animate attributeName="opacity" values="0.07;0.25;0.07" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="50;70;50" dur="4s" repeatCount="indefinite"/>
  </ellipse>
</svg>
