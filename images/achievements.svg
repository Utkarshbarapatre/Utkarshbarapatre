<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131b" />
    </linearGradient>

    <!-- Golden Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ffb300" />
      <stop offset="100%" stop-color="#ff8000" />
    </linearGradient>

    <!-- Cyan/Blue Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <style>
    .bg {
      fill: url(#bg-grad);
    }

    .card {
      fill: url(#card-grad);
      stroke: rgba(88, 166, 255, 0.1);
      stroke-width: 1.5px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card-container:hover .card {
      stroke: rgba(255, 179, 0, 0.4);
      filter: drop-shadow(0 6px 16px rgba(255, 179, 0, 0.15));
      transform: translateY(-2px);
    }

    .card-container.cyan-hover:hover .card {
      stroke: rgba(0, 242, 254, 0.4);
      filter: drop-shadow(0 6px 16px rgba(0, 242, 254, 0.15));
    }

    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1px;
    }

    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #8b9eb0;
    }

    .tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
    }

    @keyframes pulse-gold {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(255, 179, 0, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(255, 179, 0, 0.8)); }
    }

    @keyframes pulse-cyan {
      0%, 100% { filter: drop-shadow(0 0 2px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.8)); }
    }

    .icon-gold {
      animation: pulse-gold 3s infinite ease-in-out;
    }

    .icon-cyan {
      animation: pulse-cyan 3s infinite ease-in-out 1.5s;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .sparkle {
      animation: spin 15s infinite linear;
      transform-origin: center;
    }

    .card-container {
      transition: transform 0.3s ease;
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="12" />

  <!-- ================= ACHIEVEMENT 1 (TCS HACKQUEST) ================= -->
  <g class="card-container" transform="translate(30, 20)">
    <rect class="card" width="350" height="110" rx="12" />
    
    <!-- Trophy Icon -->
    <g transform="translate(30, 25)" class="icon-gold">
      <!-- Outer decorative circle -->
      <circle cx="30" cy="30" r="28" fill="none" stroke="rgba(255, 179, 0, 0.15)" stroke-width="1" stroke-dasharray="4 2" class="sparkle" />
      <circle cx="30" cy="30" r="24" fill="rgba(255, 179, 0, 0.05)" />
      <!-- Trophy SVG path -->
      <path d="M22,16 L38,16 L38,24 C38,28.4 34.4,32 30,32 C25.6,32 22,28.4 22,24 Z" fill="url(#gold-grad)" />
      <path d="M18,18 L22,18 L22,24 C22,25.8 23.2,27.3 24.8,27.8 C23.1,26.8 22,25 22,23 L22,20 L18,20 C16.9,20 16,19.1 16,18 C16,16.9 16.9,16 18,16 Z" fill="url(#gold-grad)" />
      <path d="M42,18 L38,18 L38,24 C38,25.8 36.8,27.3 35.2,27.8 C36.9,26.8 38,25 38,23 L38,20 L42,20 C43.1,20 44,19.1 44,18 C44,19.1 43.1,20 42,20 Z" fill="url(#gold-grad)" transform="scale(-1, 1) translate(-60, 0)" />
      <path d="M28,32 L32,32 L32,40 L28,40 Z" fill="url(#gold-grad)" />
      <path d="M24,40 L36,40 L36,44 L24,44 Z" fill="url(#gold-grad)" />
    </g>

    <!-- Text Info -->
    <g transform="translate(100, 32)">
      <text class="title">TCS HackQuest</text>
      <text y="22" class="subtitle">Top 100 National Finalist</text>
      <!-- Tag badge -->
      <g transform="translate(0, 36)">
        <rect width="90" height="20" rx="4" fill="rgba(255, 179, 0, 0.15)" stroke="rgba(255, 179, 0, 0.3)" stroke-width="1" />
        <text x="45" y="14" class="tag" text-anchor="middle" fill="#ffb300">CYBERSECURITY</text>
      </g>
    </g>
  </g>

  <!-- ================= ACHIEVEMENT 2 (NTAI) ================= -->
  <g class="card-container cyan-hover" transform="translate(420, 20)">
    <rect class="card" width="350" height="110" rx="12" />
    
    <!-- Medal/Certificate Icon -->
    <g transform="translate(30, 25)" class="icon-cyan">
      <!-- Outer decorative circle -->
      <circle cx="30" cy="30" r="28" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1" stroke-dasharray="4 2" class="sparkle" />
      <circle cx="30" cy="30" r="24" fill="rgba(0, 242, 254, 0.05)" />
      <!-- Medal/Star Path -->
      <path d="M30,14 L33.5,21.5 L41.5,22.5 L35.5,28 L37.2,36 L30,32 L22.8,36 L24.5,28 L18.5,22.5 L26.5,21.5 Z" fill="url(#cyan-grad)" />
      <!-- Ribbons behind the star -->
      <path d="M26,32 L22,46 L28,44 L31,34 Z" fill="#00c6ff" opacity="0.8" />
      <path d="M34,32 L38,46 L32,44 L29,34 Z" fill="#0072ff" opacity="0.8" />
    </g>

    <!-- Text Info -->
    <g transform="translate(100, 32)">
      <text class="title">Best Paper Award</text>
      <text y="22" class="subtitle">NTAI National Conference</text>
      <!-- Tag badge -->
      <g transform="translate(0, 36)">
        <rect width="115" height="20" rx="4" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1" />
        <text x="57.5" y="14" class="tag" text-anchor="middle" fill="#00f2fe">RESEARCH &amp; R&amp;D</text>
      </g>
    </g>
  </g>
</svg>
