<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="160" rx="12" fill="url(#bg)"/>

  <!-- Card 1: TCS HackQuest -->
  <rect x="20" y="16" width="370" height="128" rx="10" fill="#161b22" stroke="#ffd700" stroke-opacity="0.2" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="20" y="16" width="370" height="3" rx="1.5" fill="#ffd700" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Trophy icon -->
  <g transform="translate(44, 36)">
    <circle cx="22" cy="22" r="20" fill="#ffd700" fill-opacity="0.08">
      <animate attributeName="fill-opacity" values="0.08;0.2;0.08" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="22" r="15" fill="#ffd700" fill-opacity="0.06" stroke="#ffd700" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate" from="0 22 22" to="360 22 22" dur="20s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="30" font-size="22" text-anchor="middle">🏆</text>
  </g>

  <!-- Text -->
  <text x="104" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">TCS HackQuest</text>
  <text x="104" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b9eb0">Top 100 National Finalist</text>
  <rect x="104" y="82" width="110" height="20" rx="4" fill="#ffd700" fill-opacity="0.12" stroke="#ffd700" stroke-opacity="0.35" stroke-width="1"/>
  <text x="159" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffd700" text-anchor="middle" letter-spacing="1">CYBERSECURITY</text>

  <!-- Glow pulse bottom -->
  <ellipse cx="205" cy="144" rx="60" ry="4" fill="#ffd700" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="60;80;60" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Card 2: NTAI Best Paper -->
  <rect x="410" y="16" width="370" height="128" rx="10" fill="#161b22" stroke="#00f2fe" stroke-opacity="0.2" stroke-width="1.5">
    <animate attributeName="stroke-opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="410" y="16" width="370" height="3" rx="1.5" fill="#00f2fe" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Medal icon -->
  <g transform="translate(434, 36)">
    <circle cx="22" cy="22" r="20" fill="#00f2fe" fill-opacity="0.08">
      <animate attributeName="fill-opacity" values="0.08;0.2;0.08" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="22" r="15" fill="#00f2fe" fill-opacity="0.06" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate" from="360 22 22" to="0 22 22" dur="18s" repeatCount="indefinite"/>
    </circle>
    <text x="22" y="30" font-size="22" text-anchor="middle">📄</text>
  </g>

  <!-- Text -->
  <text x="494" y="52" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Best Paper Award</text>
  <text x="494" y="72" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8b9eb0">NTAI National Technology Conference</text>
  <rect x="494" y="82" width="125" height="20" rx="4" fill="#00f2fe" fill-opacity="0.10" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1"/>
  <text x="556" y="96" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="1">RESEARCH &amp; INNOVATION</text>

  <!-- Glow pulse bottom -->
  <ellipse cx="595" cy="144" rx="60" ry="4" fill="#00f2fe" opacity="0.1">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="60;80;60" dur="4s" repeatCount="indefinite"/>
  </ellipse>
</svg>
