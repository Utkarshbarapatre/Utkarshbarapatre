<svg width="800" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="800" height="250" rx="12" fill="url(#bg)"/>

  <!-- Card 1: Languages -->
  <g>
    <rect x="20" y="18" width="240" height="216" rx="10" fill="url(#cardBg)" stroke="#58a6ff" stroke-opacity="0.15" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- Card accent top bar -->
    <rect x="20" y="18" width="240" height="3" rx="1.5" fill="#58a6ff" opacity="0.5"/>

    <text x="140" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" opacity="0">
      LANGUAGES
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/>
    </text>
    <line x1="40" y1="56" x2="240" y2="56" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- C/C++ row -->
    <rect x="36" y="65" width="208" height="34" rx="7" fill="#00599C" fill-opacity="0.08" stroke="#00599C" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="0.08;0.16;0.08" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="56" cy="82" r="6" fill="#00599C" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    </circle>
    <text x="72" y="87" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">C / C++
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>
    </text>

    <!-- Python row -->
    <rect x="36" y="107" width="208" height="34" rx="7" fill="#3776AB" fill-opacity="0.08" stroke="#3776AB" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.55s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="0.08;0.16;0.08" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="56" cy="124" r="6" fill="#3776AB" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.55s" fill="freeze"/>
    </circle>
    <text x="72" y="129" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">Python
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.55s" fill="freeze"/>
    </text>

    <!-- Java row -->
    <rect x="36" y="149" width="208" height="34" rx="7" fill="#ED8B00" fill-opacity="0.08" stroke="#ED8B00" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.70s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="0.08;0.16;0.08" dur="5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="56" cy="166" r="6" fill="#ED8B00" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.70s" fill="freeze"/>
    </circle>
    <text x="72" y="171" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">Java
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.70s" fill="freeze"/>
    </text>

    <!-- HTML/CSS/JS row -->
    <rect x="36" y="191" width="208" height="34" rx="7" fill="#E34F26" fill-opacity="0.08" stroke="#E34F26" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.85s" fill="freeze"/>
    </rect>
    <circle cx="56" cy="208" r="6" fill="#E34F26" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.85s" fill="freeze"/>
    </circle>
    <text x="72" y="213" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">HTML / CSS / JS
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.85s" fill="freeze"/>
    </text>
  </g>

  <!-- Card 2: Frameworks -->
  <g>
    <rect x="280" y="18" width="240" height="216" rx="10" fill="url(#cardBg)" stroke="#bc85ff" stroke-opacity="0.15" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="18" width="240" height="3" rx="1.5" fill="#bc85ff" opacity="0.5"/>

    <text x="400" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" opacity="0">
      FRAMEWORKS
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.4s" fill="freeze"/>
    </text>
    <line x1="300" y1="56" x2="500" y2="56" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- React Native -->
    <rect x="296" y="65" width="208" height="34" rx="7" fill="#61DAFB" fill-opacity="0.07" stroke="#61DAFB" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="0.07;0.15;0.07" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="316" cy="82" r="6" fill="#61DAFB" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </circle>
    <text x="332" y="87" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">React Native
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6s" fill="freeze"/>
    </text>

    <!-- Flask -->
    <rect x="296" y="107" width="208" height="34" rx="7" fill="#ffffff" fill-opacity="0.04" stroke="#888" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.75s" fill="freeze"/>
    </rect>
    <circle cx="316" cy="124" r="6" fill="#a0a0a0" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.75s" fill="freeze"/>
    </circle>
    <text x="332" y="129" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">Flask
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.75s" fill="freeze"/>
    </text>

    <!-- Ansible -->
    <rect x="296" y="149" width="208" height="34" rx="7" fill="#EE0000" fill-opacity="0.07" stroke="#EE0000" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.90s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="0.07;0.14;0.07" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <circle cx="316" cy="166" r="6" fill="#EE0000" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.90s" fill="freeze"/>
    </circle>
    <text x="332" y="171" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">Ansible
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.90s" fill="freeze"/>
    </text>

    <!-- Netlify/Vercel -->
    <rect x="296" y="191" width="208" height="34" rx="7" fill="#00C7B7" fill-opacity="0.07" stroke="#00C7B7" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.05s" fill="freeze"/>
    </rect>
    <circle cx="316" cy="208" r="6" fill="#00C7B7" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.05s" fill="freeze"/>
    </circle>
    <text x="332" y="213" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">Netlify / Vercel
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.05s" fill="freeze"/>
    </text>
  </g>

  <!-- Card 3: DevOps & Tools -->
  <g>
    <rect x="540" y="18" width="240" height="216" rx="10" fill="url(#cardBg)" stroke="#ff79c6" stroke-opacity="0.15" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.15;0.4;0.15" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="540" y="18" width="240" height="3" rx="1.5" fill="#ff79c6" opacity="0.5"/>

    <text x="660" y="46" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5" opacity="0">
      DEVOPS &amp; TOOLS
      <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.6s" fill="freeze"/>
    </text>
    <line x1="560" y1="56" x2="760" y2="56" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

    <!-- Git / GitHub -->
    <rect x="556" y="65" width="208" height="34" rx="7" fill="#F05032" fill-opacity="0.07" stroke="#F05032" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
      <animate attributeName="fill-opacity" values="0.07;0.14;0.07" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="576" cy="82" r="6" fill="#F05032" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </circle>
    <text x="592" y="87" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">Git / GitHub
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
    </text>

    <!-- VS Code -->
    <rect x="556" y="107" width="208" height="34" rx="7" fill="#007ACC" fill-opacity="0.07" stroke="#007ACC" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/>
    </rect>
    <circle cx="576" cy="124" r="6" fill="#007ACC" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/>
    </circle>
    <text x="592" y="129" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">VS Code
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/>
    </text>

    <!-- Linux / Bash -->
    <rect x="556" y="149" width="208" height="34" rx="7" fill="#ffb300" fill-opacity="0.07" stroke="#ffb300" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.10s" fill="freeze"/>
    </rect>
    <circle cx="576" cy="166" r="6" fill="#ffb300" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.10s" fill="freeze"/>
    </circle>
    <text x="592" y="171" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">Linux / Bash
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.10s" fill="freeze"/>
    </text>

    <!-- REST APIs -->
    <rect x="556" y="191" width="208" height="34" rx="7" fill="#bc85ff" fill-opacity="0.07" stroke="#bc85ff" stroke-opacity="0.2" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.25s" fill="freeze"/>
    </rect>
    <circle cx="576" cy="208" r="6" fill="#bc85ff" opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.25s" fill="freeze"/>
    </circle>
    <text x="592" y="213" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="600" fill="#c9d1d9" opacity="0">REST APIs
      <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.25s" fill="freeze"/>
    </text>
  </g>
</svg>
