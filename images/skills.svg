<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing card gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0e131b" />
    </linearGradient>
  </defs>

  <style>
    .bg {
      fill: url(#bg-grad);
    }

    .card {
      fill: url(#card-grad);
      stroke: rgba(88, 166, 255, 0.1);
      stroke-width: 1.5px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .card-container:hover .card {
      stroke: rgba(188, 133, 255, 0.4);
      filter: drop-shadow(0 6px 16px rgba(188, 133, 255, 0.15));
      transform: translateY(-2px);
    }

    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 1px;
    }

    .pill {
      fill: rgba(255, 255, 255, 0.02);
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .pill:hover {
      fill: rgba(255, 255, 255, 0.08);
      stroke: #58a6ff;
    }

    .skill-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #c9d1d9;
    }

    /* Floating/Breathing Animation for Pills */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
      100% { transform: translateY(0px); }
    }

    .group-1 { animation: float 5s ease-in-out infinite; }
    .group-2 { animation: float 5.5s ease-in-out infinite 0.4s; }
    .group-3 { animation: float 4.8s ease-in-out infinite 0.8s; }
    .group-4 { animation: float 6s ease-in-out infinite 0.2s; }
    .group-5 { animation: float 5.2s ease-in-out infinite 0.6s; }
    .group-6 { animation: float 4.5s ease-in-out infinite 1s; }
    .group-7 { animation: float 5.8s ease-in-out infinite 0.5s; }

    .card-container {
      transition: transform 0.3s ease;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" class="bg" rx="12" />

  <!-- ================= COLUMN 1: LANGUAGES ================= -->
  <g class="card-container" transform="translate(30, 20)">
    <rect class="card" width="230" height="200" rx="12" />
    <text x="115" y="32" class="card-title" text-anchor="middle">LANGUAGES</text>
    <line x1="20" y1="45" x2="210" y2="45" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- C/C++ -->
    <g class="group-1" transform="translate(20, 58)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#00599C" />
      <text x="36" y="20" class="skill-text">C / C++</text>
    </g>

    <!-- Python -->
    <g class="group-2" transform="translate(20, 100)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#3776AB" />
      <text x="36" y="20" class="skill-text">Python</text>
    </g>

    <!-- Java -->
    <g class="group-3" transform="translate(20, 142)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#ED8B00" />
      <text x="36" y="20" class="skill-text">Java</text>
    </g>
  </g>

  <!-- ================= COLUMN 2: FRAMEWORKS ================= -->
  <g class="card-container" transform="translate(285, 20)">
    <rect class="card" width="230" height="200" rx="12" />
    <text x="115" y="32" class="card-title" text-anchor="middle">FRAMEWORKS &amp; LIBS</text>
    <line x1="20" y1="45" x2="210" y2="45" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- React Native -->
    <g class="group-4" transform="translate(20, 58)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#61DAFB" />
      <text x="36" y="20" class="skill-text">React Native</text>
    </g>

    <!-- Flask -->
    <g class="group-5" transform="translate(20, 100)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#000000" stroke="#888" stroke-width="0.5" />
      <text x="36" y="20" class="skill-text">Flask (Python)</text>
    </g>

    <!-- Web Essentials -->
    <g class="group-6" transform="translate(20, 142)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#E34F26" />
      <text x="36" y="20" class="skill-text">HTML5 / CSS3 / JS</text>
    </g>
  </g>

  <!-- ================= COLUMN 3: DEVOPS & TOOLS ================= -->
  <g class="card-container" transform="translate(540, 20)">
    <rect class="card" width="230" height="200" rx="12" />
    <text x="115" y="32" class="card-title" text-anchor="middle">DEVOP &amp; TOOLS</text>
    <line x1="20" y1="45" x2="210" y2="45" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <!-- Ansible -->
    <g class="group-7" transform="translate(20, 58)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#EE0000" />
      <text x="36" y="20" class="skill-text">Ansible</text>
    </g>

    <!-- Git & GitHub -->
    <g class="group-1" transform="translate(20, 100)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#F05032" />
      <text x="36" y="20" class="skill-text">Git / GitHub</text>
    </g>

    <!-- CI/CD & Deploy -->
    <g class="group-2" transform="translate(20, 142)">
      <rect class="pill" width="190" height="32" rx="8" />
      <circle cx="20" cy="16" r="5" fill="#00C7B7" />
      <text x="36" y="20" class="skill-text">Netlify / Vercel</text>
    </g>
  </g>
</svg>
