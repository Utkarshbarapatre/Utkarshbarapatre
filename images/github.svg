<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 45" width="180" height="45">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg {
      fill: url(#bg-grad);
      stroke: #ffffff;
      stroke-width: 1.5px;
      transition: all 0.3s ease;
    }

    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 2px;
    }

    .icon {
      fill: #ffffff;
      filter: url(#neon-glow);
    }

    @keyframes pulse {
      0%, 100% {
        stroke-opacity: 0.4;
        filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.2));
      }
      50% {
        stroke-opacity: 1;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
      }
    }

    .border-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Button Body -->
  <rect x="2" y="2" width="176" height="41" rx="8" class="bg border-pulse" />

  <!-- Content Group -->
  <g transform="translate(22, 12)">
    <!-- GitHub Icon -->
    <path class="icon" d="M10,0 C4.5,0 0,4.5 0,10 C0,14.4 2.9,18.1 6.8,19.4 C7.3,19.5 7.5,19.2 7.5,18.9 C7.5,18.7 7.5,17.9 7.5,17.1 C4.7,17.7 4.1,15.8 4.1,15.8 C3.7,14.7 3.0,14.4 3.0,14.4 C2.1,13.8 3.1,13.8 3.1,13.8 C4.1,13.9 4.6,14.8 4.6,14.8 C5.5,16.4 7.0,15.9 7.6,15.6 C7.7,15.0 7.9,14.5 8.2,14.3 C6.0,14.0 3.7,13.2 3.7,9.4 C3.7,8.3 4.1,7.4 4.7,6.7 C4.6,6.5 4.3,5.4 4.8,4.0 C4.8,4.0 5.7,3.7 7.7,5.0 C8.5,4.8 9.4,4.7 10.3,4.7 C11.1,4.7 12.0,4.8 12.8,5.0 C14.8,3.7 15.7,4.0 15.7,4.0 C16.2,5.4 15.9,6.5 15.8,6.7 C16.4,7.4 16.8,8.3 16.8,9.4 C16.8,13.2 14.5,14.0 12.3,14.3 C12.6,14.6 12.9,15.1 12.9,15.9 C12.9,17.0 12.9,17.9 12.9,18.2 C12.9,18.5 13.1,18.8 13.6,18.7 C17.5,17.4 20.3,13.7 20.3,9.4 C20.0,4.5 15.5,0 10,0 Z" />
    
    <!-- Text -->
    <text x="32" y="14" class="btn-text">MY GITHUB</text>
  </g>
</svg>
