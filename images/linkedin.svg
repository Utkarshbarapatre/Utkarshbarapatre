<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 45" width="180" height="45">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg {
      fill: url(#bg-grad);
      stroke: #0072ff;
      stroke-width: 1.5px;
      transition: all 0.3s ease;
    }

    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 2px;
    }

    .icon {
      fill: #0072ff;
      filter: url(#neon-glow);
    }

    @keyframes pulse {
      0%, 100% {
        stroke-opacity: 0.4;
        filter: drop-shadow(0 0 1px rgba(0, 114, 255, 0.2));
      }
      50% {
        stroke-opacity: 1;
        filter: drop-shadow(0 0 8px rgba(0, 114, 255, 0.6));
      }
    }

    .border-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Button Body -->
  <rect x="2" y="2" width="176" height="41" rx="8" class="bg border-pulse" />

  <!-- Content Group -->
  <g transform="translate(22, 12)">
    <!-- LinkedIn Icon -->
    <path class="icon" d="M19,0 L1,0 C0.4,0 0,0.4 0,1 L0,19 C0,19.6 0.4,20 1,20 L19,20 C19.6,20 20,19.6 20,19 L20,1 C20,0.4 19.6,0 19,0 Z M6,17 L3,17 L3,8 L6,8 L6,17 Z M4.5,6.7 C3.5,6.7 2.7,5.9 2.7,4.9 C2.7,3.9 3.5,3.1 4.5,3.1 C5.5,3.1 6.3,3.9 6.3,4.9 C6.3,5.9 5.5,6.7 4.5,6.7 Z M17,17 L14,17 L14,12.2 C14,11.1 13.8,10.1 12.4,10.1 C11,10.1 10.9,11.2 10.9,12.1 L10.9,17 L7.9,17 L7.9,8 L10.8,8 L10.8,9.2 C11.2,8.4 12.2,7.7 13.6,7.7 C16.6,7.7 17,9.7 17,12.3 L17,17 Z" />
    
    <!-- Text -->
    <text x="32" y="14" class="btn-text">LINKEDIN</text>
  </g>
</svg>
