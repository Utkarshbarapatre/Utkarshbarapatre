<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background base -->
  <rect width="800" height="280" rx="14" fill="#0d1117"/>

  <!-- Subtle grid via lines -->
  <g stroke="#58a6ff" stroke-width="0.3" stroke-opacity="0.06">
    <line x1="0" y1="40" x2="800" y2="40"/>
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="40" y1="0" x2="40" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="280"/>
    <line x1="160" y1="0" x2="160" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="280"/>
    <line x1="240" y1="0" x2="240" y2="280"/>
    <line x1="280" y1="0" x2="280" y2="280"/>
    <line x1="320" y1="0" x2="320" y2="280"/>
    <line x1="360" y1="0" x2="360" y2="280"/>
    <line x1="400" y1="0" x2="400" y2="280"/>
    <line x1="440" y1="0" x2="440" y2="280"/>
    <line x1="480" y1="0" x2="480" y2="280"/>
    <line x1="520" y1="0" x2="520" y2="280"/>
    <line x1="560" y1="0" x2="560" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="640" y1="0" x2="640" y2="280"/>
    <line x1="680" y1="0" x2="680" y2="280"/>
    <line x1="720" y1="0" x2="720" y2="280"/>
    <line x1="760" y1="0" x2="760" y2="280"/>
  </g>

  <!-- Glowing orb left - SMIL animated -->
  <circle cx="130" cy="110" r="100" fill="#7c3aed" opacity="0.12">
    <animate attributeName="cx" values="130;180;130" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;140;110" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="110" r="60" fill="#6d28d9" opacity="0.08">
    <animate attributeName="cx" values="130;180;130" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;140;110" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- Glowing orb right - SMIL animated -->
  <circle cx="670" cy="170" r="120" fill="#0ea5e9" opacity="0.10">
    <animate attributeName="cx" values="670;620;670" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;130;170" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.10;0.18;0.10" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer border animated -->
  <rect x="2" y="2" width="796" height="276" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="20 10" opacity="0.6">
    <animateTransform attributeName="stroke-dashoffset" type="translate" from="0" to="30" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;30;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc85ff"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="45%" stop-color="#bc85ff"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>
  </defs>

  <!-- Accent top-left sparkle -->
  <g opacity="0.7">
    <circle cx="60" cy="40" r="2" fill="#bc85ff">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="240" r="2" fill="#58a6ff">
      <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;2.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="50" r="1.5" fill="#ff79c6">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="235" r="1.5" fill="#0ea5e9">
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Role badge top -->
  <rect x="305" y="32" width="190" height="22" rx="11" fill="#bc85ff" fill-opacity="0.12" stroke="#bc85ff" stroke-opacity="0.3" stroke-width="1"/>
  <text x="400" y="48" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" fill="#bc85ff" text-anchor="middle" letter-spacing="2">COMPUTER ENGINEER</text>

  <!-- Main title - fade in -->
  <text x="400" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" text-anchor="middle" letter-spacing="3" opacity="0">
    UTKARSH BARAPATRE
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Subtitle - animated underline sweep -->
  <text x="400" y="155" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="#8b9eb0" text-anchor="middle" letter-spacing="3" opacity="0">
    Backend Dev  ·  Mobile Apps  ·  Automation
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Animated underline bar -->
  <rect x="250" y="162" width="0" height="2" rx="1" fill="url(#titleGrad)" opacity="0.8">
    <animate attributeName="width" values="0;300" dur="1.5s" begin="0.8s" fill="freeze"/>
    <animate attributeName="x" values="400;250" dur="1.5s" begin="0.8s" fill="freeze"/>
  </rect>

  <!-- Tech pill badges row -->
  <!-- C/C++ -->
  <rect x="115" y="192" width="62" height="24" rx="12" fill="#00599C" fill-opacity="0.15" stroke="#00599C" stroke-opacity="0.4" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze"/>
  </rect>
  <text x="146" y="209" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#58a6ff" text-anchor="middle" opacity="0">C / C++
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.0s" fill="freeze"/>
  </text>

  <!-- Python -->
  <rect x="185" y="192" width="62" height="24" rx="12" fill="#3776AB" fill-opacity="0.15" stroke="#3776AB" stroke-opacity="0.4" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
  </rect>
  <text x="216" y="209" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#58a6ff" text-anchor="middle" opacity="0">Python
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.1s" fill="freeze"/>
  </text>

  <!-- Java -->
  <rect x="255" y="192" width="56" height="24" rx="12" fill="#ED8B00" fill-opacity="0.15" stroke="#ED8B00" stroke-opacity="0.4" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </rect>
  <text x="283" y="209" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#e6a817" text-anchor="middle" opacity="0">Java
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
  </text>

  <!-- React Native -->
  <rect x="319" y="192" width="90" height="24" rx="12" fill="#61DAFB" fill-opacity="0.12" stroke="#61DAFB" stroke-opacity="0.35" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
  </rect>
  <text x="364" y="209" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#61DAFB" text-anchor="middle" opacity="0">React Native
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Flask -->
  <rect x="417" y="192" width="56" height="24" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#888" stroke-opacity="0.4" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
  </rect>
  <text x="445" y="209" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#c9d1d9" text-anchor="middle" opacity="0">Flask
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/>
  </text>

  <!-- Ansible -->
  <rect x="481" y="192" width="66" height="24" rx="12" fill="#EE0000" fill-opacity="0.12" stroke="#EE0000" stroke-opacity="0.35" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </rect>
  <text x="514" y="209" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#ff7b7b" text-anchor="middle" opacity="0">Ansible
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- Git -->
  <rect x="555" y="192" width="55" height="24" rx="12" fill="#F05032" fill-opacity="0.12" stroke="#F05032" stroke-opacity="0.35" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
  </rect>
  <text x="582" y="209" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#F05032" text-anchor="middle" opacity="0">Git
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- Animated scanning line -->
  <rect x="14" y="236" width="0" height="1" rx="1" fill="#58a6ff" opacity="0.4">
    <animate attributeName="width" values="0;772;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Trophies section bottom -->
  <text x="400" y="262" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#8b9eb0" text-anchor="middle" letter-spacing="1.5" opacity="0">
    🏆 TCS HackQuest Top 100  ·  📄 NTAI Best Paper Award
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.8s" fill="freeze"/>
  </text>
</svg>
