<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep space background -->
    <radialGradient id="space" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="60%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- 3D text gradients -->
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0eaff"/>
      <stop offset="40%" stop-color="#a5c1ff"/>
      <stop offset="100%" stop-color="#6e9fff"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5d8ff"/>
      <stop offset="100%" stop-color="#8ab4ff"/>
    </linearGradient>
    <linearGradient id="sideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a6fa0"/>
      <stop offset="100%" stop-color="#1e2f50"/>
    </linearGradient>

    <!-- Neon accent -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#b024ef"/>
      <stop offset="100%" stop-color="#ff6ec7"/>
    </linearGradient>

    <!-- Purple glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="320" rx="16" fill="url(#space)"/>

  <!-- Stars -->
  <g opacity="0.7">
    <circle cx="50" cy="30" r="1" fill="white"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="15" r="0.8" fill="white"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="25" r="1.2" fill="#a0c4ff"><animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="60" r="0.8" fill="white"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="280" r="1" fill="#c084fc"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="290" r="0.8" fill="white"><animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="12" r="1" fill="#60a5fa"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="8" r="0.6" fill="white"><animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="295" r="0.9" fill="#a78bfa"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="305" r="0.8" fill="white"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Isometric floor grid -->
  <g opacity="0.12" stroke="#5b8dde" stroke-width="0.8">
    <!-- Horizontal perspective lines converging to center -->
    <line x1="0" y1="320" x2="400" y2="220"/><line x1="800" y1="320" x2="400" y2="220"/>
    <line x1="0" y1="310" x2="800" y2="310"/>
    <line x1="100" y1="320" x2="400" y2="225"/><line x1="700" y1="320" x2="400" y2="225"/>
    <line x1="200" y1="320" x2="400" y2="232"/><line x1="600" y1="320" x2="400" y2="232"/>
    <line x1="300" y1="320" x2="400" y2="244"/><line x1="500" y1="320" x2="400" y2="244"/>
    <!-- Vertical grid lines -->
    <line x1="100" y1="316" x2="100" y2="320"/><line x1="200" y1="310" x2="200" y2="320"/>
    <line x1="300" y1="310" x2="300" y2="320"/><line x1="400" y1="220" x2="400" y2="320"/>
    <line x1="500" y1="310" x2="500" y2="320"/><line x1="600" y1="310" x2="600" y2="320"/>
    <line x1="700" y1="316" x2="700" y2="320"/>
  </g>

  <!-- Floating 3D cube left -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,8;0,-8;0,8" dur="6s" repeatCount="indefinite"/>
    <!-- Cube faces -->
    <polygon points="62,130 92,114 92,150 62,166" fill="#1e3a5f" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="62,130 92,114 122,130 92,146" fill="#2a4a7a" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="92,146 122,130 122,166 92,182" fill="#152c4a" stroke="#3b82f6" stroke-width="0.8" stroke-opacity="0.5"/>
  </g>

  <!-- Floating 3D cube right -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0,-6;0,6;0,-6" dur="8s" repeatCount="indefinite"/>
    <polygon points="668,120 698,104 698,140 668,156" fill="#3a1a5f" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="668,120 698,104 728,120 698,136" fill="#4a2a7a" stroke="#a78bfa" stroke-width="0.8" stroke-opacity="0.6"/>
    <polygon points="698,136 728,120 728,156 698,172" fill="#2a1050" stroke="#7c3aed" stroke-width="0.8" stroke-opacity="0.5"/>
  </g>

  <!-- Left glow orb -->
  <circle cx="110" cy="155" r="80" fill="#6366f1" opacity="0">
    <animate attributeName="opacity" values="0;0.08;0.05;0.08;0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="80;100;80" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Right glow orb -->
  <circle cx="690" cy="155" r="80" fill="#8b5cf6" opacity="0">
    <animate attributeName="opacity" values="0;0.07;0.04;0.07;0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="80;105;80" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- === 3D EXTRUDED TEXT: UTKARSH === -->
  <!-- Depth layer (extrude bottom-right) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
    <!-- Shadow depth layers x6 -->
    <text x="406" y="146" font-family="'Segoe UI', Arial Black, sans-serif" font-size="58" font-weight="900" fill="#0a1628" text-anchor="middle" letter-spacing="4">UTKARSH</text>
    <text x="405" y="145" font-family="'Segoe UI', Arial Black, sans-serif" font-size="58" font-weight="900" fill="#0e1e38" text-anchor="middle" letter-spacing="4">UTKARSH</text>
    <text x="404" y="144" font-family="'Segoe UI', Arial Black, sans-serif" font-size="58" font-weight="900" fill="#122640" text-anchor="middle" letter-spacing="4">UTKARSH</text>
    <text x="403" y="143" font-family="'Segoe UI', Arial Black, sans-serif" font-size="58" font-weight="900" fill="#162e50" text-anchor="middle" letter-spacing="4">UTKARSH</text>
    <text x="402" y="142" font-family="'Segoe UI', Arial Black, sans-serif" font-size="58" font-weight="900" fill="#1a3660" text-anchor="middle" letter-spacing="4">UTKARSH</text>
    <text x="401" y="141" font-family="'Segoe UI', Arial Black, sans-serif" font-size="58" font-weight="900" fill="#1e4070" text-anchor="middle" letter-spacing="4">UTKARSH</text>
    <!-- Top face - bright -->
    <text x="400" y="140" font-family="'Segoe UI', Arial Black, sans-serif" font-size="58" font-weight="900" fill="url(#faceGrad)" text-anchor="middle" letter-spacing="4">UTKARSH</text>
  </g>

  <!-- === 3D EXTRUDED TEXT: BARAPATRE === -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/>
    <text x="406" y="204" font-family="'Segoe UI', Arial Black, sans-serif" font-size="44" font-weight="900" fill="#0a1628" text-anchor="middle" letter-spacing="6">BARAPATRE</text>
    <text x="405" y="203" font-family="'Segoe UI', Arial Black, sans-serif" font-size="44" font-weight="900" fill="#0e1e38" text-anchor="middle" letter-spacing="6">BARAPATRE</text>
    <text x="404" y="202" font-family="'Segoe UI', Arial Black, sans-serif" font-size="44" font-weight="900" fill="#132548" text-anchor="middle" letter-spacing="6">BARAPATRE</text>
    <text x="403" y="201" font-family="'Segoe UI', Arial Black, sans-serif" font-size="44" font-weight="900" fill="#182d58" text-anchor="middle" letter-spacing="6">BARAPATRE</text>
    <text x="402" y="200" font-family="'Segoe UI', Arial Black, sans-serif" font-size="44" font-weight="900" fill="#1d3568" text-anchor="middle" letter-spacing="6">BARAPATRE</text>
    <!-- Top face -->
    <text x="400" y="198" font-family="'Segoe UI', Arial Black, sans-serif" font-size="44" font-weight="900" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="6">BARAPATRE</text>
  </g>

  <!-- Animated neon underline -->
  <rect x="150" y="215" width="0" height="3" rx="1.5" fill="url(#neonGrad)" opacity="0.9">
    <animate attributeName="width" values="0;500" dur="1.2s" begin="1s" fill="freeze"/>
    <animate attributeName="x" values="400;150" dur="1.2s" begin="1s" fill="freeze"/>
  </rect>

  <!-- Subtitle -->
  <text x="400" y="247" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" fill="#7ea8d0" text-anchor="middle" letter-spacing="4" opacity="0">
    AI/ML ENGINEER  ·  FULL-STACK DEVELOPER  ·  CLOUD ARCHITECT
    <animate attributeName="opacity" values="0;0.9" dur="1s" begin="1.3s" fill="freeze"/>
  </text>

  <!-- Animated scanning glow line across page -->
  <rect x="-200" y="160" width="160" height="1" rx="0.5" fill="url(#neonGrad)" opacity="0.5">
    <animate attributeName="x" values="-200;800" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Typing cursor animated -->
  <rect x="399" y="218" width="2" height="16" rx="1" fill="#bc85ff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="399;619" dur="0.01s" begin="2.5s" fill="freeze"/>
  </rect>

  <!-- Corner accent brackets -->
  <g stroke="url(#neonGrad)" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 16 16 L 16 36 M 16 16 L 36 16"/>
    <path d="M 784 16 L 784 36 M 784 16 L 764 16"/>
    <path d="M 16 304 L 16 284 M 16 304 L 36 304"/>
    <path d="M 784 304 L 784 284 M 784 304 L 764 304"/>
  </g>

  <!-- Badge row -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
    <!-- TCS badge -->
    <rect x="252" y="264" width="138" height="22" rx="11" fill="#ffd700" fill-opacity="0.1" stroke="#ffd700" stroke-opacity="0.4" stroke-width="1"/>
    <text x="321" y="279" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ffd700" text-anchor="middle" letter-spacing="1">🏆 TCS HackQuest Top 100</text>
    <!-- NTAI badge -->
    <rect x="406" y="264" width="143" height="22" rx="11" fill="#00f2fe" fill-opacity="0.08" stroke="#00f2fe" stroke-opacity="0.35" stroke-width="1"/>
    <text x="477" y="279" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="1">📄 NTAI Best Paper 2025</text>
  </g>

  <!-- Particle dots floating -->
  <circle cx="200" cy="80" r="1.5" fill="#bc85ff" opacity="0.4">
    <animate attributeName="cy" values="80;70;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="90" r="1.2" fill="#58a6ff" opacity="0.5">
    <animate attributeName="cy" values="90;78;90" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="240" r="1" fill="#ff79c6" opacity="0.4">
    <animate attributeName="cy" values="240;230;240" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="660" cy="250" r="1.3" fill="#34d399" opacity="0.4">
    <animate attributeName="cy" values="250;238;250" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
