<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 45" width="180" height="45">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg {
      fill: url(#bg-grad);
      stroke: #00f2fe;
      stroke-width: 1.5px;
      transition: all 0.3s ease;
    }

    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 2px;
    }

    .icon {
      fill: #00f2fe;
      filter: url(#neon-glow);
    }

    @keyframes pulse {
      0%, 100% {
        stroke-opacity: 0.4;
        filter: drop-shadow(0 0 1px rgba(0, 242, 254, 0.2));
      }
      50% {
        stroke-opacity: 1;
        filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6));
      }
    }

    .border-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Button Body -->
  <rect x="2" y="2" width="176" height="41" rx="8" class="bg border-pulse" />

  <!-- Content Group -->
  <g transform="translate(20, 12)">
    <!-- Globe Icon -->
    <path class="icon" d="M10,0 C4.5,0 0,4.5 0,10 C0,15.5 4.5,20 10,20 C15.5,20 20,15.5 20,10 C20,4.5 15.5,0 10,0 Z M17.9,8 L14.7,8 C14.4,4.9 13.8,2.7 12.9,1.6 C15.3,2.6 17.1,4.9 17.9,8 Z M10,2 C10.8,2.7 11.5,4.9 11.8,8 L8.2,8 C8.5,4.9 9.2,2.7 10,2 Z M2.1,8 L5.3,8 C5.6,4.9 6.2,2.7 7.1,1.6 C4.7,2.6 2.9,4.9 2.1,8 Z M2.1,12 L5.3,12 C5.6,15.1 6.2,17.3 7.1,18.4 C4.7,17.4 2.9,15.1 2.1,12 Z M10,18 C9.2,17.3 8.5,15.1 8.2,12 L11.8,12 C11.5,15.1 10.8,17.3 10,18 Z M17.9,12 C17.1,15.1 15.3,17.4 12.9,18.4 C13.8,17.3 14.4,15.1 14.7,12 L17.9,12 Z M12.8,10 C12.8,10 12.8,10 12.8,10 L7.2,10 C7.2,10 7.2,10 7.2,10 L12.8,10 Z" />
    
    <!-- Text -->
    <text x="32" y="14" class="btn-text">PORTFOLIO</text>
  </g>
</svg>
