<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 45" width="180" height="45">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg {
      fill: url(#bg-grad);
      stroke: #bc85ff;
      stroke-width: 1.5px;
      transition: all 0.3s ease;
    }

    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 2px;
    }

    .icon {
      fill: #bc85ff;
      filter: url(#neon-glow);
    }

    @keyframes pulse {
      0%, 100% {
        stroke-opacity: 0.4;
        filter: drop-shadow(0 0 1px rgba(188, 133, 255, 0.2));
      }
      50% {
        stroke-opacity: 1;
        filter: drop-shadow(0 0 8px rgba(188, 133, 255, 0.6));
      }
    }

    .border-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
  </style>

  <!-- Button Body -->
  <rect x="2" y="2" width="176" height="41" rx="8" class="bg border-pulse" />

  <!-- Content Group -->
  <g transform="translate(20, 12)">
    <!-- Email Icon (Envelope) -->
    <path class="icon" d="M18,2 L2,2 C0.9,2 0,2.9 0,4 L0,16 C0,17.1 0.9,18 2,18 L18,18 C19.1,18 20,17.1 20,16 L20,4 C20,2.9 19.1,2 18,2 Z M18,6 L10,11 L2,6 L2,4 L10,9 L18,4 L18,6 Z" />
    
    <!-- Text -->
    <text x="32" y="14" class="btn-text">EMAIL ME</text>
  </g>
</svg>
